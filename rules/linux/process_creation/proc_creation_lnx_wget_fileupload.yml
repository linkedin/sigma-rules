title: Wget File Upload Activity - Linux
id: 8f1df45f-5be6-4118-b058-c00f09e51a95
related:
    - id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
      type: derived
status: test
description: Detects a wget process sending data
references:
    - https://man7.org/linux/man-pages/man1/wget.1.html
    - https://gtfobins.linuxsec.org/gtfobins/wget/
author: Seth Hanford (LinkedIn)
date: 2025-08-19
tags:
    - attack.exfiltration
    - attack.t1567
logsource:
    category: process_creation
    product: linux
detection:
    selection_img:
        Image|endswith: '/wget'
    send_cli:
        - CommandLine|contains:
              - ' --post-' # --post-data or --post-file
              - ' --body-' # --body-data or --body-file
    send_method:
        CommandLine|contains:
            - ' --method=PUT'
            - ' --method=POST'
    filter_optional_localhost:
        CommandLine|contains:
            - '://localhost'
            - '://127.0.0.1'
    condition: selection_img and (1 of send_*) and not 1 of filter_optional_*
falsepositives:
    - Sending data via wget may be uncommon but is not by itself malicious
level: informational
